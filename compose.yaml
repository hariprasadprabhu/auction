services:
  postgres:
    image: postgres:16-alpine
    container_name: auctiondeck-db
    environment:
      POSTGRES_DB: auctiondeck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-postgres:
    image: postgres:16-alpine
    container_name: auctiondeck-auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${AUTH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USERNAME:-postgres} -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-discovery:
    build:
      context: ./service-discovery
    container_name: auctiondeck-service-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: ./auth-service
    container_name: auctiondeck-auth-service
    environment:
      PORT: 8080
      AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/authdb
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyHereMustBeAtLeast256BitsLongForHmacSha256!!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      EUREKA_URL: http://service-discovery:8761/eureka/
      APP_NAME: ${APP_NAME:-AuctionDeck}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-noreply@bidplayers.in}
    depends_on:
      auth-postgres:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  auction:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auctiondeck-monolith
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/auctiondeck
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyHereMustBeAtLeast256BitsLongForHmacSha256!!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token-change-me}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_URL: http://service-discovery:8761/eureka/
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  api-gateway:
    build:
      context: ./api-gateway
    container_name: auctiondeck-api-gateway
    environment:
      PORT: 8080
      EUREKA_URL: http://service-discovery:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      service-discovery:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      auction:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  auth_postgres_data:
