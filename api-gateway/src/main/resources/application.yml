server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service-openapi
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v3/api-docs/auth
          filters:
            - SetPath=/api/v3/api-docs
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: auction-monolith
          uri: lb://AUCTION
          predicates:
            - Path=/api/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
